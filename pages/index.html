<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB GIS Sebaran SMA Kabupaten Muara Enim</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Search -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(to right, #d9ecff, #edf7ff);
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .judul {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 25px;
            border-radius: 20px;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .judul h2 {
            color: #5d90d8;
            font-size: 24px;
        }

        .judul p {
            color: gray;
            font-size: 14px;
        }

        .home {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;

            text-decoration: none;

            background: white;

            color: #5d90d8;

            padding: 10px 18px;

            border-radius: 30px;

            font-weight: bold;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
        }

        .home:hover {

            background: #cde6ff;

        }

        .legend {

            position: absolute;

            bottom: 20px;

            right: 20px;

            z-index: 999;

            background: white;

            padding: 15px;

            border-radius: 15px;

            box-shadow: 0 2px 10px rgba(0, 0, 0, .2);

            font-size: 14px;

        }

        .legend h4 {

            margin-bottom: 8px;

            color: #5d90d8;

        }
    </style>

</head>

<body>

    <!-- Tombol Home -->

    <a href="halamanawal.html" class="home">
        🧸 Home
    </a>

    <!-- Judul -->

    <div class="judul">

        <h2>🗺️ WEB GIS Sebaran SMA Kabupaten Muara Enim 🩵</h2>

        <p>Pendidikan Geografi | Intan Nur Suci Rahmadhani</p>

    </div>

    <!-- Legenda -->

    <div class="legend">

        <h4>🌸 Keterangan</h4>

        📍 Lokasi SMA Kabupaten Muara Enim

    </div>

    <!-- Map -->

    <div id="map"></div>

    <!-- Leaflet JS -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Search -->

    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>

        // Membuat peta

        var map = L.map('map').setView([-3.72, 103.79], 9);

        // Basemap OpenStreetMap

        L.tileLayer(

            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

            {

                attribution: '&copy; OpenStreetMap Contributors',

                maxZoom: 19

            }

        ).addTo(map);

        // Search lokasi

        L.Control.geocoder({

            placeholder: "Cari lokasi...",

            defaultMarkGeocode: true

        }).addTo(map);

        // Style GeoJSON

        function style(feature) {

            return {

                color: "#3b82f6",

                weight: 2,

                fillColor: "#9ed2ff",

                fillOpacity: 0.5

            };

        }

        // Load GeoJSON

        fetch("../data/untitled(2).geojson")

            .then(response => response.json())

            .then(data => {

                var geojson = L.geoJSON(data, {

                    style: style,

                    onEachFeature: function (feature, layer) {

                        let popup = "";

                        if (feature.properties) {

                            for (let key in feature.properties) {

                                popup += "<b>" + key + "</b> : " +

                                    feature.properties[key] +

                                    "<br>";

                            }

                        }

                        layer.bindPopup(popup);

                    }

                }).addTo(map);

                // Zoom otomatis ke data

                map.fitBounds(geojson.getBounds());

            })

            .catch(error => {

                console.log("GeoJSON gagal dimuat");

                console.log(error);

            });

    </script>

</body>

</html>
